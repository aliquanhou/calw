<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calw · 3D 全息仪表盘</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;600;800;900&family=JetBrains+Mono:wght@300;500;700&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --bg: #05050a;
    --surface: rgba(16,16,28,0.8);
    --border: rgba(108,92,231,0.15);
    --text: #d0d0e8;
    --dim: #5a5a7a;
    --accent: #6c5ce7;
    --accent2: #00cec9;
    --accent3: #fd79a8;
    --accent4: #fdcb6e;
    --glow: rgba(108,92,231,0.25);
  }
  
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }
  
  /* ===== 3D 场景容器 ===== */
  #scene-container {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }
  
  /* ===== 扫描线 ===== */
  .scanlines {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,206,201,0.015) 2px,
      rgba(0,206,201,0.015) 4px
    );
  }
  
  /* ===== 暗角 ===== */
  .vignette {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(5,5,10,0.8) 100%);
  }
  
  /* ===== HUD 覆盖层 ===== */
  .hud {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  
  /* 角落装饰 */
  .corner-tl, .corner-tr, .corner-bl, .corner-br {
    position: fixed;
    z-index: 2;
    pointer-events: none;
  }
  .corner-tl { top: 20px; left: 20px; }
  .corner-tr { top: 20px; right: 20px; transform: scaleX(-1); }
  .corner-bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
  .corner-br { bottom: 20px; right: 20px; transform: scale(-1,-1); }
  
  .corner-svg { width: 60px; height: 60px; }
  
  /* ===== 主信息 ===== */
  .main-info {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    text-align: center;
    pointer-events: none;
  }
  
  .main-info .title {
    font-size: clamp(2.5rem, 6vw, 5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    text-shadow: 0 0 80px var(--glow);
    animation: titlePulse 3s ease-in-out infinite;
  }
  
  @keyframes titlePulse {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }
  
  .main-info .sub {
    font-size: clamp(0.8rem, 1.5vw, 1.2rem);
    color: var(--dim);
    letter-spacing: 8px;
    margin-top: 8px;
    font-weight: 300;
  }
  
  .main-info .sub span {
    color: var(--accent2);
    font-weight: 600;
  }
  
  /* ===== 时钟 ===== */
  .clock-container {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    text-align: center;
    pointer-events: none;
  }
  
  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(1.5rem, 3vw, 2.5rem);
    font-weight: 300;
    color: var(--text);
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(0,206,201,0.2);
  }
  
  .clock .seconds {
    color: var(--accent2);
    font-weight: 700;
  }
  
  .date-display {
    font-size: 0.75rem;
    color: var(--dim);
    letter-spacing: 4px;
    margin-top: 4px;
  }
  
  /* ===== 底部状态栏 ===== */
  .bottom-bar {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 3;
    display: flex;
    gap: 40px;
    align-items: center;
    pointer-events: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 12px 32px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  
  .bottom-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--dim);
  }
  
  .bottom-item .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: blink 1.5s ease-in-out infinite;
  }
  
  .bottom-item .dot.green { background: #28c840; }
  .bottom-item .dot.cyan { background: var(--accent2); }
  .bottom-item .dot.purple { background: var(--accent); }
  .bottom-item .dot.pink { background: var(--accent3); }
  
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }
  
  .bottom-item .value {
    color: var(--text);
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
  }
  
  /* ===== 侧边数据面板 ===== */
  .data-panel {
    position: fixed;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  
  .data-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    min-width: 140px;
    text-align: right;
  }
  
  .data-item .label {
    font-size: 0.6rem;
    color: var(--dim);
    text-transform: uppercase;
    letter-spacing: 2px;
  }
  
  .data-item .number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 2px;
  }
  
  .data-item .number.green { color: #28c840; }
  .data-item .number.cyan { color: var(--accent2); }
  .data-item .number.purple { color: var(--accent); }
  .data-item .number.pink { color: var(--accent3); }
  .data-item .number.yellow { color: var(--accent4); }
  
  /* ===== 左侧键盘提示 ===== */
  .key-hint {
    position: fixed;
    left: 30px;
    bottom: 100px;
    z-index: 3;
    pointer-events: none;
  }
  
  .key-hint .hint-text {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 1px;
    writing-mode: vertical-rl;
    text-orientation: mixed;
  }
  
  .key-hint .keys {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 12px;
  }
  
  .key-hint kbd {
    display: inline-block;
    padding: 4px 8px;
    font-size: 0.6rem;
    font-family: 'JetBrains Mono', monospace;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--dim);
    text-align: center;
    min-width: 30px;
  }
  
  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .bottom-bar { gap: 16px; padding: 10px 16px; flex-wrap: wrap; justify-content: center; bottom: 16px; }
    .data-panel { right: 12px; gap: 8px; }
    .data-item { min-width: 100px; padding: 8px 12px; }
    .data-item .number { font-size: 1rem; }
    .key-hint { display: none; }
  }
  
  @media (max-width: 480px) {
    .data-panel { display: none; }
    .bottom-bar { gap: 8px; font-size: 0.65rem; }
  }
</style>
</head>
<body>

<!-- 3D 场景 -->
<div id="scene-container"></div>

<!-- 覆盖层 -->
<div class="scanlines"></div>
<div class="vignette"></div>

<!-- 角落装饰 -->
<svg class="corner-tl corner-svg" viewBox="0 0 60 60">
  <path d="M0 0 L60 0 L60 4 L4 4 L4 60 L0 60 Z" fill="none" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <path d="M0 0 L40 0" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
  <path d="M0 0 L0 40" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
</svg>
<svg class="corner-tr corner-svg" viewBox="0 0 60 60">
  <path d="M0 0 L60 0 L60 4 L4 4 L4 60 L0 60 Z" fill="none" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <path d="M60 0 L20 0" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
  <path d="M60 0 L60 40" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
</svg>
<svg class="corner-bl corner-svg" viewBox="0 0 60 60">
  <path d="M0 0 L60 0 L60 4 L4 4 L4 60 L0 60 Z" fill="none" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <path d="M0 60 L40 60" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
  <path d="M0 60 L0 20" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
</svg>
<svg class="corner-br corner-svg" viewBox="0 0 60 60">
  <path d="M0 0 L60 0 L60 4 L4 4 L4 60 L0 60 Z" fill="none" stroke="rgba(108,92,231,0.3)" stroke-width="1"/>
  <path d="M60 60 L20 60" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>
  <path d="M60 60 L60 20" fill="none" stroke="rgba(0,206,201,0.4)" stroke-width="1"/>

<!-- 时钟 -->
<div class="clock-container">
  <div class="clock" id="clock">00:00:<span class="seconds">00</span></div>
  <div class="date-display" id="date-display">----年--月--日 星期-</div>
</div>

<!-- 主标题 -->
<div class="main-info">
  <div class="title">CALW</div>
  <div class="sub">全功能自主 AI · <span>v2.1</span></div>
</div>

<!-- 右侧数据面板 -->
<div class="data-panel">
  <div class="data-item">
    <div class="label">系统状态</div>
    <div class="number green" id="sys-status">ONLINE</div>
  </div>
  <div class="data-item">
    <div class="label">运行时间</div>
    <div class="number cyan" id="uptime">00:00:00</div>
  </div>
  <div class="data-item">
    <div class="label">工具就绪</div>
    <div class="number purple" id="tools-ready">40+</div>
  </div>
  <div class="data-item">
    <div class="label">活跃会话</div>
    <div class="number pink" id="sessions">1</div>
  </div>
  <div class="data-item">
    <div class="label">响应延迟</div>
    <div class="number yellow" id="latency">0ms</div>

</div>

    <kbd>R</kbd>

  </div>
</div>

<!-- 底部状态栏 -->
<div class="bottom-bar">
  <div class="bottom-item">
    <span class="dot green"></span>
    系统 <span class="value" id="bar-status">正常</span>
  </div>
  <div class="bottom-item">
    <span class="dot cyan"></span>
    帧率 <span class="value" id="fps-display">60</span> FPS
  </div>
  <div class="bottom-item">
    <span class="dot purple"></span>
    粒子 <span class="value" id="particle-count">0</span>
  </div>
  <div class="bottom-item">
    <span class="dot pink"></span>
    连接 <span class="value" id="connection-count">0</span>
  </div>
</div>

<!-- Three.js -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ===== 场景初始化 =====
const container = document.getElementById('scene-container');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05050a, 0.0025);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 2, 12);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ 
  antialias: true, 
  alpha: true,
  powerPreference: "high-performance"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ===== 轨道控制（带自动旋转） =====
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.enableZoom = true;
controls.zoomSpeed = 0.5;
controls.enablePan = false;
controls.maxPolarAngle = Math.PI / 2.2;
controls.minPolarAngle = Math.PI / 4;
controls.target.set(0, 0, 0);

// ===== 灯光 =====
const ambientLight = new THREE.AmbientLight(0x222244, 0.5);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0x6c5ce7, 1.5);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);

const dirLight2 = new THREE.DirectionalLight(0x00cec9, 0.8);
dirLight2.position.set(-5, -3, 5);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0xfd79a8, 0.5, 20);
pointLight.position.set(0, 3, 0);
scene.add(pointLight);

// ===== 核心：旋转环 =====
function createRing(radius, color, opacity, tubeRadius = 0.03, segments = 64) {
  const geometry = new THREE.TorusGeometry(radius, tubeRadius, 16, segments);
  const material = new THREE.MeshBasicMaterial({
    color: color,
    transparent: true,
    opacity: opacity,
    wireframe: false
  });
  const mesh = new THREE.Mesh(geometry, material);
  return mesh;
}

// 主环组
const ringGroup = new THREE.Group();
scene.add(ringGroup);

// 多个环
const rings = [];
const ringConfigs = [
  { r: 2.0, c: 0x6c5ce7, o: 0.6, t: 0.02, s: 96, rotX: 0, rotY: 0, rotZ: 0, speed: 0.3 },
  { r: 2.4, c: 0x00cec9, o: 0.4, t: 0.015, s: 80, rotX: Math.PI/3, rotY: 0, rotZ: 0, speed: -0.2 },
  { r: 1.6, c: 0xfd79a8, o: 0.35, t: 0.015, s: 72, rotX: -Math.PI/4, rotY: Math.PI/4, rotZ: 0, speed: 0.25 },
  { r: 2.8, c: 0xfdcb6e, o: 0.2, t: 0.01, s: 64, rotX: Math.PI/2, rotY: 0, rotZ: Math.PI/6, speed: -0.15 },
  { r: 1.2, c: 0x6c5ce7, o: 0.5, t: 0.025, s: 48, rotX: 0, rotY: 0, rotZ: Math.PI/3, speed: 0.4 },
];

ringConfigs.forEach(cfg => {
  const ring = createRing(cfg.r, cfg.c, cfg.o, cfg.t, cfg.s);
  ring.rotation.x = cfg.rotX;
  ring.rotation.y = cfg.rotY;
  ring.rotation.z = cfg.rotZ;
  ring.userData = { speed: cfg.speed, axis: 'y' };
  ringGroup.add(ring);
  rings.push(ring);
});

// ===== 中心发光球体 =====
const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
const sphereMat = new THREE.MeshStandardMaterial({
  color: 0x6c5ce7,
  emissive: 0x6c5ce7,
  emissiveIntensity: 0.3,
  metalness: 0.8,
  roughness: 0.2,
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
ringGroup.add(sphere);

// 发光光晕
const glowGeo = new THREE.SphereGeometry(0.8, 16, 16);
const glowMat = new THREE.MeshBasicMaterial({
  color: 0x6c5ce7,
  transparent: true,
  opacity: 0.15,
});
const glow = new THREE.Mesh(glowGeo, glowMat);
ringGroup.add(glow);

// ===== 粒子系统 =====
const particleCount = 2000;
const particlesGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);

const colorPalette = [
  new THREE.Color(0x6c5ce7),
  new THREE.Color(0x00cec9),
  new THREE.Color(0xfd79a8),
  new THREE.Color(0xfdcb6e),
];

for (let i = 0; i < particleCount; i++) {
  const radius = 3 + Math.random() * 5;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  
  positions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = radius * Math.cos(phi);
  
  const col = colorPalette[Math.floor(Math.random() * colorPalette.length)];
  colors[i*3] = col.r;
  colors[i*3+1] = col.g;
  colors[i*3+2] = col.b;
  
  sizes[i] = 0.02 + Math.random() * 0.06;
}

particlesGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
particlesGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
particlesGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

const particleMat = new THREE.PointsMaterial({
  size: 0.06,
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  sizeAttenuation: true,
});

const particleSystem = new THREE.Points(particlesGeo, particleMat);
scene.add(particleSystem);

// ===== 连接线（粒子间） =====
let connectionLineMesh = null;

function buildConnectionLines() {
  const pos = particleSystem.geometry.attributes.position.array;
  const maxDist = 1.2;
  const maxLines = 200;
  const positions = [];
  let lineCount = 0;

  for (let i = 0; i < particleCount && lineCount < maxLines; i++) {
    for (let j = i + 1; j < particleCount && lineCount < maxLines; j++) {
      const dx = pos[i*3] - pos[j*3];
      const dy = pos[i*3+1] - pos[j*3+1];
      const dz = pos[i*3+2] - pos[j*3+2];
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
      if (dist < maxDist) {
        positions.push(pos[i*3], pos[i*3+1], pos[i*3+2]);
        positions.push(pos[j*3], pos[j*3+1], pos[j*3+2]);
        lineCount++;
      }
    }
  }

  // 移除旧线
  if (connectionLineMesh) {
    scene.remove(connectionLineMesh);
    connectionLineMesh.geometry.dispose();
    connectionLineMesh.material.dispose();
  }

  if (positions.length > 0) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const mat = new THREE.LineBasicMaterial({
      color: 0x6c5ce7,
      transparent: true,
      opacity: 0.15,
    });
    connectionLineMesh = new THREE.LineSegments(geo, mat);
    scene.add(connectionLineMesh);
  }

  document.getElementById('connection-count').textContent = lineCount;
  document.getElementById('particle-count').textContent = particleCount;
}

// 初始构建
buildConnectionLines();

// ===== 浮动标签 =====
function createLabel(text, color, position) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.color = color;
  div.style.fontFamily = "'JetBrains Mono', monospace";
  div.style.fontSize = '11px';
  div.style.fontWeight = '500';
  div.style.textShadow = '0 0 20px rgba(0,0,0,0.8)';
  div.style.letterSpacing = '2px';
  div.style.background = 'rgba(5,5,10,0.6)';
  div.style.padding = '4px 12px';
  div.style.borderRadius = '4px';
  div.style.border = '1px solid ' + color;
  div.style.backdropFilter = 'blur(4px)';
  
  const label = new CSS2DObject(div);
  label.position.set(position.x, position.y, position.z);
  return label;
}

const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(window.innerWidth, window.innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.top = '0';
labelRenderer.domElement.style.left = '0';
labelRenderer.domElement.style.pointerEvents = 'none';
labelRenderer.domElement.style.zIndex = '1';
container.appendChild(labelRenderer.domElement);

const labels = [
  createLabel('⚡ 系统', '#6c5ce7', { x: 3.5, y: 1.5, z: 0 }),
  createLabel('🌐 网络', '#00cec9', { x: -2, y: 3, z: 2 }),
  createLabel('🧠 AI', '#fd79a8', { x: 0, y: -3, z: 3 }),
  createLabel('📁 文件', '#fdcb6e', { x: -3, y: -1, z: -2 }),
  createLabel('⚙️ 工具', '#6c5ce7', { x: 2, y: -2, z: -3 }),
];

labels.forEach(l => scene.add(l));

// ===== 键盘交互 =====
let colorMode = 0;
const colorSchemes = [
  { bg: 0x05050a, fog: 0x05050a, ambient: 0x222244 },
  { bg: 0x0a0505, fog: 0x0a0505, ambient: 0x442222 },
  { bg: 0x050a0a, fog: 0x050a0a, ambient: 0x224444 },
];

document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    controls.autoRotate = !controls.autoRotate;
  }
  if (e.key === 'g' || e.key === 'G') {
    colorMode = (colorMode + 1) % colorSchemes.length;
    const scheme = colorSchemes[colorMode];
    scene.background = new THREE.Color(scheme.bg);
    scene.fog.color = new THREE.Color(scheme.fog);
    ambientLight.color = new THREE.Color(scheme.ambient);
  }
  if (e.key === 'b' || e.key === 'B') {
    // 爆发效果
    const pos = particleSystem.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      const dir = new THREE.Vector3(pos[i*3], pos[i*3+1], pos[i*3+2]).normalize();
      pos[i*3] += dir.x * 0.5;
      pos[i*3+1] += dir.y * 0.5;
      pos[i*3+2] += dir.z * 0.5;
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;
    buildConnectionLines();
  }
  if (e.key === ' ') {
    e.preventDefault();
    // 重置粒子
    const pos = particleSystem.geometry.attributes.position.array;
    for (let i = 0; i < particleCount; i++) {
      const radius = 3 + Math.random() * 5;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      pos[i*3] = radius * Math.sin(phi) * Math.cos(theta);
      pos[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
      pos[i*3+2] = radius * Math.cos(phi);
    }
    particleSystem.geometry.attributes.position.needsUpdate = true;
    buildConnectionLines();
  }
});

// ===== 时钟更新 =====
function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  document.getElementById('clock').innerHTML = `${h}:${m}:<span class="seconds">${s}</span>`;
  
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  const y = now.getFullYear();
  const mo = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const day = days[now.getDay()];
  document.getElementById('date-display').textContent = `${y}年${mo}月${d}日 星期${day}`;
}

updateClock();
setInterval(updateClock, 1000);

// ===== 模拟运行时间 =====
let startTime = Date.now();
setInterval(() => {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('uptime').textContent = `${h}:${m}:${s}`;
}, 1000);

// ===== FPS 计数器 =====
let frameCount = 0;
let lastFpsTime = performance.now();

// ===== 窗口自适应 =====
window.addEventListener('resize', () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
});

// ===== 动画循环 =====
function animate() {
  requestAnimationFrame(animate);
  
  // 环旋转
  rings.forEach((ring, i) => {
    ring.rotation.y += 0.005 * ring.userData.speed;
    ring.rotation.x += 0.001 * ring.userData.speed;
  });
  
  // 球体脉动
  const time = Date.now() * 0.001;
  sphere.scale.setScalar(1 + Math.sin(time * 0.5) * 0.05);
  glow.scale.setScalar(1 + Math.sin(time * 0.3) * 0.1);
  glow.material.opacity = 0.1 + Math.sin(time * 0.4) * 0.05;
  
  // 粒子缓慢旋转
  particleSystem.rotation.y += 0.0005;
  particleSystem.rotation.x += 0.0002;
  
  // 更新控制
  controls.update();
  
  // 渲染
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  
  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    document.getElementById('fps-display').textContent = frameCount;
    frameCount = 0;
    lastFpsTime = now;
  }
}

animate();
