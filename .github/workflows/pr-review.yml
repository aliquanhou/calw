name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master, main]
permissions:
  pull-requests: write
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' && github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Setup Python
        uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run AI Review
        id: review
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'DeepSeek' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'deepseek-chat' }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL || 'https://api.deepseek.com' }}
        run: |
          python scripts/pr_review.py --effort medium > review_output.txt
          echo "REVIEW_BODY<<EOF" >> $GITHUB_ENV
          cat review_output.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - name: Post Review Comment
        if: ${{ env.REVIEW_BODY != '' && env.REVIEW_BODY != '没有检测到代码变更，跳过审查。' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = process.env.REVIEW_BODY;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body && c.body.includes('AI 代码审查'));
            if (botComment) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: botComment.id,
              });
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body: body,
            });
